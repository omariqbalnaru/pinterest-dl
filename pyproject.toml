[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pinterest-dl"
version = "0.1.0"
description = "Download images from Pinterest pins and multi-pin share links at original resolution."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Omar Iqbal Naru" }]
requires-python = ">=3.10"
keywords = ["pinterest", "downloader", "images", "scraper"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics",
]
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
# multi-pin share links render client-side and need Chromium
browser = ["playwright>=1.40"]
dev = ["ruff>=0.4"]

[project.scripts]
pinterest-dl = "pinterest_dl:main"

[project.urls]
Homepage = "https://github.com/omariqbalnaru/pinterest-dl"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "RUF"]